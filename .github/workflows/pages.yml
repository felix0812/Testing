name: GitHub Pages

# Veröffentlicht TankRadar auf GitHub Pages – aber nur, solange das Repository privat ist.
# Ist das Repo öffentlich, wird der Deploy-Job übersprungen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp index.html app.js styles.css germany.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  skipped-public:
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Repository ist öffentlich – GitHub Pages wird nicht veröffentlicht."
